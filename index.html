<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEGA PLAN · Планировщик</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="app">
    <header class="app-header glass-panel">
      <div class="brand">
        <div class="brand-logo"><i class="fas fa-bolt"></i></div>
        <div>
          <h1>MEGA PLAN</h1>
          <p class="brand-sub">Управляй временем</p>
        </div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="themeToggle" style="background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--accent); width: 38px; height: 38px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <div class="clock" id="clock">00:00:00</div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="day"><i class="fas fa-sun"></i> Задачи</button>
      <button class="tab" data-tab="stats"><i class="fas fa-chart-pie"></i> Статистика</button>
      <button class="tab" data-tab="pomodoro"><i class="fas fa-stopwatch"></i> Таймер</button>
      <button class="tab" data-tab="habits"><i class="fas fa-fire"></i> Привычки</button>
      <button class="tab" data-tab="calendar"><i class="fas fa-calendar-alt"></i> Календарь</button>
      <button class="tab" data-tab="settings"><i class="fas fa-cog"></i> Настройки</button>
    </nav>

    <section class="tab-panel active" id="tab-day">
      <div class="stats-row">
        <div class="stat-card glass-panel">
          <div class="stat-icon"><i class="fas fa-list"></i></div>
          <div class="stat-info"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Всего</div></div>
        </div>
        <div class="stat-card glass-panel">
          <div class="stat-icon green"><i class="fas fa-check"></i></div>
          <div class="stat-info"><div class="stat-value" id="statDone">0</div><div class="stat-label">Готово</div></div>
        </div>
        <div class="stat-card glass-panel">
          <div class="stat-icon purple"><i class="fas fa-percent"></i></div>
          <div class="stat-info"><div class="stat-value" id="statPercent">0%</div><div class="stat-label">Прогресс</div></div>
        </div>
      </div>

      <div class="progress-wrap glass-panel"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>

      <div class="add-task glass-panel">
        <div class="input-row"><i class="fas fa-pen-fancy"></i><input id="taskInput" type="text" placeholder="Что нужно сделать?" maxlength="100"></div>
        <div class="input-row-mobile">
          <input id="taskTime" type="time">
          <select id="taskPriority">
            <option value="high">🔴 Важно</option>
            <option value="mid" selected>🟡 Средне</option>
            <option value="low">🟢 Легко</option>
          </select>
          <button id="addBtn" class="btn-primary"><i class="fas fa-plus"></i> Добавить</button>
        </div>
      </div>

      <div class="filters">
        <div class="search-box glass-panel"><i class="fas fa-search"></i><input id="searchInput" type="text" placeholder="Поиск..."></div>
        <select id="filterStatus" class="glass-panel">
          <option value="all">Все</option>
          <option value="active">В работе</option>
          <option value="done">Готово</option>
        </select>
        <button id="clearDone" class="btn-ghost glass-panel"><i class="fas fa-broom"></i></button>
      </div>

      <div id="tasksContainer" class="tasks-list"></div>
    </section>

    <section class="tab-panel" id="tab-stats">
      <h2 class="section-title"><i class="fas fa-chart-pie"></i> Аналитика</h2>
      <div class="stats-blocks">
        <div class="chart-card glass-panel">
          <h3>Выполнение</h3>
          <div class="donut" id="donutChart"></div>
          <p class="chart-caption" id="donutCaption">0 из 0</p>
        </div>
        <div class="chart-card glass-panel">
          <h3>🔥 Серия</h3>
          <div class="streak" id="streakBox">0</div>
        </div>
      </div>
    </section>

    <section class="tab-panel" id="tab-pomodoro">
      <h2 class="section-title"><i class="fas fa-stopwatch"></i> Помодоро</h2>
      <div class="pomodoro-wrap glass-panel">
        <div class="pomo-ring">
          <svg viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="90" class="ring-bg"/>
            <circle cx="100" cy="100" r="90" class="ring-fg" id="pomoRing"/>
          </svg>
          <div class="pomo-time" id="pomoTime">25:00</div>
        </div>
        <div class="pomo-controls">
          <button id="pomoStart" class="btn-primary"><i class="fas fa-play"></i> Старт</button>
          <button id="pomoReset" class="btn-ghost"><i class="fas fa-rotate-left"></i> Сброс</button>
        </div>
      </div>
    </section>

    <section class="tab-panel" id="tab-habits">
      <h2 class="section-title"><i class="fas fa-fire"></i> Привычки</h2>
      <div class="add-task glass-panel">
        <div class="input-row"><i class="fas fa-star"></i><input id="habitInput" type="text" placeholder="Новая привычка..."></div>
        <div class="input-row-mobile"><button id="habitAddBtn" class="btn-primary"><i class="fas fa-plus"></i> Добавить</button></div>
      </div>
      <div id="habitsList" class="habits-list"></div>
    </section>

    <section class="tab-panel" id="tab-calendar">
      <h2 class="section-title"><i class="fas fa-calendar-alt"></i> Календарь</h2>
      <div class="glass-panel placeholder-panel">
        <i class="fas fa-calendar-day"></i>
        <p>Календарь на месяц</p>
        <p style="font-size: 0.8rem; margin-top: 10px; opacity: 0.6;">(Скоро)</p>
      </div>
    </section>

    <section class="tab-panel" id="tab-settings">
      <h2 class="section-title"><i class="fas fa-cog"></i> Настройки</h2>
      <div class="settings-list">
        <div class="setting-row glass-panel">
          <span>Звуки</span>
          <div class="toggle on" id="toggleSound"></div>
        </div>
        <div class="setting-row glass-panel">
          <span>Тёмная тема</span>
          <div class="toggle on" id="toggleTheme"></div>
        </div>
      </div>
    </section>

    <footer class="app-footer">
      Сделано для Кавчака Александра Вячеславовича
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
